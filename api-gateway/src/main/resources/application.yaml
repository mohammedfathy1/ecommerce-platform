
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - AddRequestHeader= x-gateway-source , api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,gateway

  endpoint:
    gateway:
      access: read-only
