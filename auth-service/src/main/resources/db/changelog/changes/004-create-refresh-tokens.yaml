databaseChangeLog:
  - changeSet:
      id: 004-create-refresh-tokens
      author: ecommerce-team
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: UNIQUEIDENTIFIER
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UNIQUEIDENTIFIER
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: NVARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: expires_at
                  type: DATETIME2
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: DATETIME2

              - column:
                  name: created_at
                  type: DATETIME2
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_refresh_tokens_user
            onDelete: CASCADE

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
            columns:
              - column:
                  name: user_id