databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: ecommerce-team
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UNIQUEIDENTIFIER
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: NVARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: NVARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: NVARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password_hash
                  type: NVARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: NVARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME2
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME2
                  constraints:
                    nullable: false