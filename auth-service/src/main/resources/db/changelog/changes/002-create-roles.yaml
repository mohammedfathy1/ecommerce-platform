databaseChangeLog:
  - changeSet:
      id: 002-create-roles
      author: ecommerce-team
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: NVARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
  - changeSet:
      id: 002-seed-default-roles
      author: ecommerce-team
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: CUSTOMER

        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ADMIN